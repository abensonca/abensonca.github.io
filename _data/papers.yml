  title: 'The Curious Case of Centaurus A: On the Subject of the Quenched satellites'
  authors_short: Weerasooriya, Sachi, A. Benson, et al.
  year: 2026
  venue: The Open Journal of Astrophysics
  url: https://ui.adsabs.harvard.edu/abs/2026OJAp....970875W
  arxiv: https://arxiv.org/abs/2602.11270
  doi: 10.33232/001c.170875
  summary: Models calibrated to the Milky Way overpredict the number of bright satellite galaxies within
    150 kpc of Centaurus A by a factor of four, and chance alone cannot account for the shortfall. The
    missing satellites occupy the same region as Centaurus A's kiloparsec-scale radio lobes, and heating
    driven by the host's central black hole can suppress star formation in them enough to explain the
    deficit.
