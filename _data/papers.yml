- bibcode: 2026ApJ..1006L..65N
  title: 'Warm, Not Fuzzy: Generalized Ultralight Dark Matter Limits from Milky Way Satellites'
  authors_short: Nadler, Ethan O., A. Benson, et al.
  year: 2026
  venue: The Astrophysical Journal Letters
  url: https://ui.adsabs.harvard.edu/abs/2026ApJ..1006L..65N
  arxiv: https://arxiv.org/abs/2605.15371
  doi: 10.3847/2041-8213/ae8b9f
  summary: Ultralight dark matter produced with structure on small scales behaves less like the "fuzzy"
    dark matter usually assumed and more like warm dark matter, with an additional wave-interference effect
    that adds small-scale structure back in. Matching this against the observed population of Milky Way
    satellite galaxies sets a new lower limit on the particle mass that depends on the scale at which
    the field's structure peaks.
