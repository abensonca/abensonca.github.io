  title: Testing Warm Dark Matter with Kinematics of the Smallest Galaxies
  authors_short: Delos, M. Sten, A. Benson, et al.
  year: 2026
  venue: The Astrophysical Journal
  url: https://ui.adsabs.harvard.edu/abs/2026ApJ..1006..125D
  arxiv: https://arxiv.org/abs/2512.04156
  doi: 10.3847/1538-4357/ae7bed
  summary: Every dark matter halo forms with a dense spike at its center, and if dark matter is "warm"
    enough to erase small-scale structure those spikes are heavy enough to speed up the stars in the smallest
    galaxies — yet the stars in Tucana V and Triangulum II move far too slowly to match. Taken together,
    the three faintest Milky Way satellites rule out dark matter particles lighter than 5.8 keV at 95%
    confidence, a limit that better velocity measurements or the discovery of more such galaxies could
    sharpen considerably.
