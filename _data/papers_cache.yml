2026ApJ..1003...12L:
  abstract: We investigate how galactic disk structures connect to the detailed properties of their host
    dark-matter halos using the TNG50 simulation. From the hydrodynamic and matched dark-matter-only runs,
    we measure a comprehensive list of halo properties describing density structure, angular momentum,
    shape, assembly history, and environment. Using the morphological decomposition developed in Paper
    I, we quantify the sizes, scale heights, and mass fractions of the disk components for galaxies at
    0 ≤ z ≤ 4. A random forest regression shows that halo properties alone predict disk size and thickness
    with high accuracy, while a symbolic regression (SR) provides compact empirical relations with slightly
    lower accuracy. Disk height is consistently easier to predict than disk size, and lower-mass halos
    yield higher accuracy than massive halos. Predictions based on halo properties measured in the hydro
    simulations outperform those based on halos matched in the dark-matter-only simulation, reflecting
    the imprint of baryonic restructuring on the inner halo. The SHAP analysis reveals the most informative
    halo parameters include concentration, Einasto shape, global and inner spin, and recent mass accretion,
    although their importance varies across disk properties. We show correlations between disk size and
    the density─profile shape arise primarily from a disk-induced modification of the inner halo, rather
    than a primordial connection. Finally, we point out that disks become more extended with respect to
    their host halos at higher redshift in low-mass halos, while massive high-redshift halos show the
    opposite trend. We provide SR-based prescriptions that accurately map halo properties to disk structures,
    offering practical tools for galaxy─halo modeling.
  arxiv: '2512.13822'
  figure: /assets/img/papers/2026ApJ..1003...12L.png
  summary: The sizes and thicknesses of galactic disks in the TNG50 simulation can be predicted accurately
    from the properties of their surrounding dark matter halos alone, with halo concentration, spin, and
    recent growth mattering most, and disk thickness proving easier to predict than disk size. The apparent
    link between disk size and the shape of the halo's density profile arises because the disk itself
    reshapes the inner halo, rather than from any connection present when the halo first formed.
  title: Connection between Galaxy Morphology and Dark-matter Halo Structure. II. Predicting Disk Structure
    from Dark-matter Halo Properties
2026ApJ..1006..125D:
  abstract: Every dark matter halo forms with a ρ ∝ r−1.5 density cusp at its center. For warm dark matter
    (WDM), these prompt cusps can be massive enough to influence the kinematics of dwarf galaxies. By
    implementing prompt cusps in the GALACTICUS galaxy formation model, we show that the measured velocity
    dispersions of Tucana V and Triangulum II are serious outliers for dwarf galaxies arising in WDM models.
    For thermal-relic dark matter, the three faintest Milky Way satellites together constrain the particle
    mass to be mχ > 5.8 keV at 95% confidence or mχ > 9.4 keV at 90% confidence. Improved velocity dispersion
    measurements for these systems could greatly refine this constraint, as could identification and kinematic
    characterization of more such galaxies.
  arxiv: '2512.04156'
  figure: /assets/img/papers/2026ApJ..1006..125D.png
  summary: Every dark matter halo forms with a dense spike at its center, and if dark matter is "warm"
    enough to erase small-scale structure those spikes are heavy enough to speed up the stars in the smallest
    galaxies — yet the stars in Tucana V and Triangulum II move far too slowly to match. Taken together,
    the three faintest Milky Way satellites rule out dark matter particles lighter than 5.8 keV at 95%
    confidence, a limit that better velocity measurements or the discovery of more such galaxies could
    sharpen considerably.
  title: Testing Warm Dark Matter with Kinematics of the Smallest Galaxies
2026ApJ..1006L..65N:
  abstract: 'We generalize lower limits on the dark matter (DM) particle mass m derived from Milky Way
    (MW) satellite galaxy abundances to scenarios in which DM is an ultralight scalar field produced with
    a field power spectrum peaked at a subhorizon wavenumber k*. In these models, the DM field free-streams
    similarly to warm DM while also exhibiting significant small-scale wave interference effects. The
    resulting dimensionless density power spectrum shows two effects: (i) free-streaming suppression at
    kfs∼keq/[(k*/aeqm)ln(aeqm/k*)] ; and (ii) Poisson-like enhancement related to wave interference at
    k ≳ 10−2k*, which saturates near the Jeans scale kJ ∼ keq/(k*/aeqm). Comparing these predictions with
    established constraints on a free-streaming cutoff in the linear matter power spectrum from the MW
    satellite population and assuming that warm ultralight DM does not change the form of the galaxy─halo
    connection relative to cold DM, we obtain m > 6 × 10−18 eV (k*/104 Mpc−1) for k* > 104 Mpc−1 at 95%
    confidence. For smaller k*, Poisson-noise enhancement on MW satellite scales weakens the constraint,
    yielding m>6×10−18eV(k*/104Mpc−1)2 for k* < 104 Mpc−1 at 95% confidence.'
  arxiv: '2605.15371'
  figure: /assets/img/papers/2026ApJ..1006L..65N.png
  summary: Ultralight dark matter produced with structure on small scales behaves less like the "fuzzy"
    dark matter usually assumed and more like warm dark matter, with an additional wave-interference effect
    that adds small-scale structure back in. Matching this against the observed population of Milky Way
    satellite galaxies sets a new lower limit on the particle mass that depends on the scale at which
    the field's structure peaks.
  title: 'Warm, Not Fuzzy: Generalized Ultralight Dark Matter Limits from Milky Way Satellites'
2026ApJ..1008..168X:
  abstract: Galaxy assembly bias (GAB) is the dependence of galaxy clustering on secondary properties
    beyond halo mass. In this work, we study the connections between GAB and baryonic processes using
    the Galacticus semianalytic model (SAM) for galaxy formation and evolution applied to the UNIT simulation.
    By generating hundreds of galaxy mocks with varying parameters governing gas cooling, star formation,
    stellar feedback, and active galactic nucleus (AGN) feedback, we quantify the GAB signal using a shuffling
    technique that compares the clustering of the original galaxy samples with that of shuffled samples,
    in which galaxies are randomly reassigned among halos of the same mass. We then compare the GAB signals
    associated with halo concentration and smoothed environmental density, and use the random forest (RF)
    algorithm to identify which baryonic processes are most correlated with GAB within the explored SAM
    parameter space. We find that for stellar-mass-selected galaxies, the dominant baryonic processes
    are gas cooling and stellar feedback, and the result does not change significantly with the number
    density; for star formation rate (SFR)-selected galaxies, the primary process shifts from star formation
    to gas cooling as the number density increases. These results reveal a correlational dependence of
    GAB on baryonic processes within the explored Galacticus SAM parameter space.
  arxiv: '2605.19323'
  figure: /assets/img/papers/2026ApJ..1008..168X.png
  title: Correlation between Baryonic Process and Galaxy Assembly Bias
2026PhRvD.113j3011M:
  abstract: Self-interacting dark matter (SIDM) theories predict that dark matter halos experience core-collapse
    in late-stage evolution, a process where the halo's inner region rapidly increases in density and
    decreases in size. This process can be modeled by treating the dark matter as a gravothermal fluid,
    and solving the fluid equations to predict the density profile evolution. This model is incomplete
    without calibration to N-body simulations, through a constant factor β included in the thermal conductivity
    for the long-mean-free-path limit. The value of β employed in the gravothermal fluid formalism has
    varied between studies, with no clear universal value in the literature. In this work, we use the
    N-body code Arepo to conduct a series of isolated core-collapse simulations across a range of scattering
    cross sections, halo concentrations, and halo masses to calibrate the heat transfer parameter β. We
    find that β is independent of cross section, halo concentration, and halo mass for velocity independent
    elastic scattering cross sections. We present a model for an effective β as a function of a dimensionless
    cross section, to describe halo evolution in the long mean free path limit, and show that it accurately
    captures halo evolution as long as the cross section is not too large. This effective model facilitates
    comparisons between simulations and the gravothermal model and enables fast predictions of the dark
    matter density profile at any given time without running N-body simulations.
  arxiv: '2504.13004'
  figure: /assets/img/papers/2026PhRvD.113j3011M.png
  summary: Dark matter halos that interact with themselves eventually undergo a runaway collapse of their
    inner regions, a process usually modelled by treating the dark matter as a heat-conducting fluid with
    one free parameter that different studies have set differently. A suite of N-body simulations shows
    that this parameter does not depend on halo mass, concentration, or interaction strength, allowing
    fast and consistent predictions without running new simulations.
  title: Calibrating the self-interacting dark matter gravothermal catastrophe with N-body simulations
2026PhRvD.114d3043K:
  abstract: We present the full sample of measurements of the warm dust emission of 31 strongly-lensed,
    multiply imaged quasars, observed with JWST MIRI multiband imaging, which we use to constrain the
    particle properties of dark matter. The strongly lensed warm dust region of quasars is compact and
    statistically sensitive to a population of dark matter halos down to masses of 106M⊙. The high spatial
    resolution and infrared sensitivity of MIRI make it uniquely suited to measure multiply imaged warm
    dust emission from quasars and thus to infer the properties of low-mass dark halos. In this work,
    we present image fluxes as well as dark matter sensitive warm dust flux ratios inferred from spectral
    energy distribution fitting. We then use these flux ratios to test for the presence of a warm dark
    matter turnover in the halo mass function. We use a forward modeling pipeline which explores dark
    matter parameters while also accounting for tidal stripping effects on subhalos, globular clusters,
    and complex deflector macromodels with m=1,m=3, and m=4 elliptical multipole moments. Adopting a comparable
    prior on the projected density of substructure to previous analyses, the data presented here provide
    a factor of 2 improvement in sensitivity to a turnover in the halo mass function. Assuming subhalo
    abundance predicted by the semianalytic model galacticus, we infer with a Bayes factor of 10∶1, a
    half-mode mass mhm<107.8M⊙. If instead we use a prior from N-body simulations, we infer mhm<107.6M⊙.
    This corresponds to a thermally produced dark matter mass of 5.6 (6.4) keV for the galacticus and
    N-body priors, respectively. This is one of the strongest constraints to date on a turnover on the
    halo mass function, and the flux ratios and inference methodology presented here can be used to test
    a broad range of dark matter physics.
  arxiv: '2511.07765'
  figure: /assets/img/papers/2026PhRvD.114d3043K.png
  summary: Infrared images of the warm dust around 31 multiply imaged quasars, taken with JWST, double
    the sensitivity to a cutoff in the number of low-mass dark matter clumps relative to earlier work,
    and show no sign of one down to about 10^7.8 solar masses. That implies dark matter particles produced
    thermally in the early universe must be heavier than roughly 6 keV.
  title: JWST lensed quasar dark matter survey. III. Dark matter sensitive flux ratios and warm dark matter
    constraint from the full sample
2026PhRvD.114d3044G:
  abstract: We present a measurement of the free-streaming length of dark matter (DM) and subhalo abundance
    around 28 quadruple image strong lenses using observations from James webb space telescope mid-infrared
    instrument presented in Paper III of this series. We improve on previous inferences on DM properties
    from lensed quasars by simultaneously reconstructing extended lensed arcs with image positions and
    relative magnifications (flux ratios). Our forward modeling framework generates full populations of
    subhalos, line-of-sight halos, and globular clusters, uses an accurate model for subhalo tidal evolution,
    and accounts for free-streaming effects on halo abundance and concentration. Modeling lensed arcs
    leads to more-precise model-predicted flux ratios, breaking covariance between subhalo abundance and
    the free-streaming scale parametrized by the half-mode mass mhm. Assuming subhalo abundance predicted
    by the semianalytic model galacticus (N-body simulations), we infer (Bayes factor of 10∶1) mhm<107.4M⊙
    (mhm<107.2M⊙), a 0.4 dex improvement relative to omitting lensed arcs. These bounds correspond to
    lower limits on thermal relic DM particle masses of 6.5 and 7.4 keV, respectively. Conversely, assuming
    DM is cold, we infer a projected mass in subhalos (106<m/M⊙<1010.7) of 1.7-1.2+2.6×107M⊙ kpc-2 at
    95% confidence. This is consistent with galacticus predictions (0.9×107M⊙ kpc-2), but in mild tension
    with recent N-body simulations (0.6×107M⊙ kpc-2). Our results are among the strongest bounds on warm
    dark matter, and the most precise measurement of subhalo abundance around strong lenses. Further improvements
    will follow from the large sample of lenses to be discovered by Euclid, Rubin, and Roman.
  arxiv: '2511.07513'
  figure: /assets/img/papers/2026PhRvD.114d3044G.png
  summary: Adding the detailed shapes of lensed arcs to the brightnesses of multiply imaged quasars in
    28 lens systems tightens limits on how far dark matter particles travel before clumping, ruling out
    any smoothing of structure above about 10^7.4 solar masses and requiring a thermally produced dark
    matter particle heavier than about 7 keV. The mass found in small clumps around the lens galaxies
    matches semi-analytic predictions, but sits mildly above recent N-body simulations.
  title: JWST lensed quasar dark matter survey. IV. Stringent warm dark matter constraints from the joint
    reconstruction of extended lensed arcs and quasar flux ratios
2026PhRvL.137g1001N:
  abstract: We explore the lowest mass limit that can be placed on the halo mass function in cold dark
    matter (CDM) using 28 strong gravitational lenses. For this purpose, we study an extreme model in
    which the halo mass function and mass-concentration relation follow CDM, with a sharp cutoff at some
    mass scale, mlow. Lensing provides a unique window into this quantity as it does not depend on the
    presence of baryons in dark matter halos and allows for the detection of low mass halos at cosmological
    distances, both in the lens galaxies and along the line of sight. Our model incorporates the effects
    of tidal stripping of subhalos, leading to the presence of many subhalos below a given model cutoff
    scale. We place an upper limit on the low-mass cutoff of the halo mass function of mlow<108.3 M⊙ at
    10∶1 odds using a prior for the normalization of the subhalo mass function from the semianalytic model
    galacticus and mlow<108.2 M⊙ at 10∶1 odds using a prior from N-body simulations. These limits are
    comparable to, or stronger than, existing constraints based on Milky Way satellite galaxies. Based
    on these results, we forecast more than an order of magnitude improvement with a sample of 200 quadruply
    imaged quasar lenses. This number represents a small subset of the thousands that are anticipated
    to be discovered by Rubin, Euclid, and Roman. Furthermore, with this larger sample of lenses we expect
    to directly constrain the normalization of the subhalo mass function, thereby eliminating a major
    source of uncertainty in our current measurements.
  arxiv: '2604.05237'
  figure: /assets/img/papers/2026PhRvL.137g1001N.png
  summary: Even if dark matter is perfectly cold, 28 strong gravitational lenses require that halos keep
    forming down to at least 10^8.3 solar masses, a limit comparable to or stronger than the one from
    the Milky Way's satellite galaxies and one that does not depend on those halos containing any stars.
    A sample of 200 such lenses, a small fraction of what Rubin, Euclid, and Roman are expected to find,
    would push the limit more than a factor of ten lower.
  title: Measurement of the Minimum Cold Dark Matter Halo Mass with Strong Gravitational Lensing
2026PhRvL.137h1004G:
  abstract: The formation of gravitationally bound overdensities of dark matter (DM), or halos, is a generic
    prediction of theories with particle DM. We present a measurement of halo properties in 28 quadruple
    image strong lens systems recently observed by JWST, and use these observations to constrain the free-streaming
    length, λFS, of DM, a quantity that depends on the DM particle mass and formation mechanism. We improve
    on previous lensing analyses by simultaneously reconstructing extended lensed arcs with image positions
    and relative magnifications, enhancing sensitivity to perturbations by halos. Our analysis rules out
    deviations from the predictions of cold dark matter (CDM) on scales above 107.2M⊙ and 107.4M⊙ for
    subhalo abundance predicted by cosmological N-body simulations and semianalytic models, respectively.
    These bounds correspond to upper limits λFS<6.0 kpc and λFS<7.0 kpc, and lower limits on the mass
    of a spin─1/2 thermal relic DM particle mtherm>7.4 keV and mtherm>6.5 keV. Conversely, assuming a
    negligible free-streaming length, as predicted by CDM, we measure a projected mass in subhalos around
    elliptical galaxies 1.7-1.2+2.6×107 M⊙ kpc-2 at 95% confidence. These inferences confirm key predictions
    of the CDM paradigm.
  arxiv: '2606.05277'
  figure: /assets/img/papers/2026PhRvL.137h1004G.png
  summary: The pattern of distortions in 28 quadruply imaged quasars observed by JWST shows that dark
    matter still clumps on scales below about 10^7 solar masses, limiting the distance its particles stream
    before structure forms to under 6 to 7 kpc and requiring a thermal relic particle heavier than about
    7 keV. Assuming dark matter is cold instead, the mass held in small clumps around elliptical lens
    galaxies is measured directly, confirming a central prediction of the standard picture.
  title: Free-Streaming Length of Dark Matter from JWST Observations of 28 Strong Gravitational Lenses
