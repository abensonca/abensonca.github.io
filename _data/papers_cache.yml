2026arXiv260605277G:
  abstract: The formation of gravitationally bound overdensities of dark matter (DM), or \textit{halos},
    is a generic prediction of theories with particle DM. We present a measurement of halo properties
    in 28 quadruple image strong lens systems recently observed by JWST, and use these observations to
    constrain the free-streaming length, $λ_{\rm{FS}}$, of DM, a quantity that depends on the DM particle
    mass and formation mechanism. We improve on previous lensing analyses by simultaneously reconstructing
    extended lensed arcs with image positions and relative magnifications, enhancing sensitivity to perturbations
    by halos. Our analysis rules out deviations from the predictions of cold dark matter (CDM) on scales
    above $10^{7.2} M_{\odot}$ and $10^{7.4} M_{\odot}$ for subhalo abundance predicted by cosmological
    $N$-body simulations and semi-analytic models, respectively. These bounds correspond to upper limits
    $λ_{\rm{FS}}<6.0 \ \rm{kpc}$ and $λ_{\rm{FS}}<7.0 \ \rm{kpc}$, and lower limits on the mass of a spin--1/2
    thermal relic DM particle $m_{\rm{therm}}>7.4 \ \rm{keV}$ and $m_{\rm{therm}}>6.5 \ \rm{keV}$. Conversely,
    assuming a negligible free-streaming length, as predicted by CDM, we measure a projected mass in subhalos
    around elliptical galaxies $1.7_{-1.2}^{+2.6} \times 10^7 \ \mathrm{M}_{\odot} \ \rm{kpc^{-2}}$ at
    $95 \%$ confidence. These inferences confirm key predictions of the CDM paradigm.
  arxiv: '2606.05277'
  figure: /assets/img/papers/2026arXiv260605277G.png
  summary: This study uses observations from the James Webb Space Telescope to measure the properties
    of dark matter halos in 28 strong gravitational lens systems, providing significant constraints on
    the free-streaming length of dark matter. The results support the cold dark matter model by ruling
    out deviations on large scales and establishing lower limits on the mass of thermal relic dark matter
    particles.
  title: The free-streaming length of dark matter from JWST observations of 28 strong gravitational lenses
2026arXiv260610006C:
  abstract: The Standard Model of particle physics contains a diverse set of particle species, motivating
    the possibility of a similarly complex dark sector. Here we study two-component dark matter (DM) mixtures,
    in which one component behaves as standard CDM while the other suppresses the formation of small-scale
    structure, either through an astrophysically relevant de~Broglie wavelength (fuzzy DM; FDM) or collisional
    damping from temperature-independent scattering (interacting DM; IDM). Using the observed population
    of Milky Way satellite galaxies, we derive new leading constraints on the parameter spaces of mixed
    FDM and of mixed IDM coupled to photons ($γ$-DM), neutrinos ($ν$-DM), or baryons ($p$-DM), for beyond-CDM
    fractions down to $50\%$. We require that the linear matter power spectra of allowed models remain
    less suppressed than a constrained reference model. The resulting $95\%$ confidence bounds on FDM
    mass and IDM cross section weaken systematically with decreasing fraction, following distinct power-law
    scalings. At $50\%$ fraction, IDM cross section bounds weaken by a factor of $\sim$2--6 and FDM mass
    bounds by $\sim$1.5, relative to the $100\%$ case. We forecast that idealized future satellite surveys,
    which adopt approximate LSST sensitivity thresholds, can improve these $100\%$ bounds by a factor
    of $\sim$1.6--14 for IDM and $\sim$3 for FDM. Self-consistent cosmological simulations of mixed DM
    scenarios will be essential to more robustly characterize the degeneracy between particle physics
    parameters and fractional contribution, to extend constraints to lower fractions, and to identify
    signatures beyond satellite abundance to further inform these models.
  arxiv: '2606.10006'
  figure: /assets/img/papers/2026arXiv260610006C.png
  summary: This study establishes new constraints on mixed dark matter models using data from Milky Way
    satellite galaxies, revealing how the presence of different dark matter components affects the formation
    of small-scale structures. The findings indicate that as the fraction of non-standard dark matter
    increases, the constraints on its properties weaken, highlighting the need for future surveys to refine
    these limits further.
  title: 'Mixed Dark Matter: Limits from the Milky Way Satellite Galaxies'
2026arXiv260612137B:
  abstract: We measure the dark matter halo mass function, with backsplash halos removed, from a wide
    range of cosmological-box and zoom-in simulations. These include the MultiDark Planck boxes, along
    with a suite of zoom-in simulations of Group, Milky Way, and LMC-mass halos. The Milky Way simulations
    include both CDM and non-CDM initial conditions. Using these measurements, we calibrate the parameters
    of flexible fitting functions for the halo mass function and the window function, along with parameterized
    models for various systematics, including finite box size effects, halo isolation criteria, halo detection
    efficiency, and contamination by artificial halos (objects forming from particle noise in the initial
    conditions). We show that this model shows remarkable consistency with N-body simulations over a broad
    range of redshifts, and ten orders of magnitude in halo mass ($10^6\mathrm{M}_\odot$ to $10^{16}\mathrm{M}_\odot$).
    Our model typically maintains a high precision of 12% and captures complex behaviors, including small-scale
    cut-offs, oscillations, and enhancements. In specific mass intervals for certain power spectra, we
    see larger deviations of 40-50%. Furthermore, when integrated with a simple model for environmental
    dependence, this fitting function provides a robust description of how environmental density influences
    the halo mass function. This precision model captures a wide variety of dark matter paradigms (including
    thermal relics, axions, and models with dark-sector interactions), is accurate for halo masses down
    to $10^7\mathrm{M}_\odot$, and is a critical ingredient for model-independent dark-matter inference
    from forthcoming data.
  arxiv: '2606.12137'
  figure: /assets/img/papers/2026arXiv260612137B.png
  summary: This research presents a highly precise model for the dark matter halo mass function, applicable
    across various dark matter theories and effective over a vast range of halo masses. The model's accuracy
    and ability to account for environmental influences make it essential for future dark matter studies
    and data analysis.
  title: A Unified Halo Mass Function Across Dark Matter Models from High-Resolution Multi-Scale Simulations
